[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--strict-markers --cov=backend.app --cov-report=term-missing --cov-report=xml --cov-fail-under=75"
markers = [
  "resilience: malformed, adversarial, and concurrency tests",
]

[tool.coverage.run]
branch = true
source = ["backend.app"]
omit = ["backend/app/llm_client.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "B008", # FastAPI uses dependency declarations in function defaults.
  "E501", # The formatter handles code; reports/prompts contain intentional long strings.
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["backend/app"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
