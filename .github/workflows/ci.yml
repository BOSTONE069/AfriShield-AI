name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            frontend/requirements.txt
            requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Test with coverage threshold
        env:
          USE_LLM: "false"
          USE_LLM_REPORTS: "false"
        run: pytest
      - name: Evaluation regression gate
        env:
          USE_LLM: "false"
          USE_LLM_REPORTS: "false"
        run: >-
          python evaluation/evaluate.py
          --dataset evaluation/data/afrishield_eval_v1.jsonl
          --output-dir evaluation/results/ci
          --max-false-negative-rate 0.17
          --min-accuracy 0.35
      - name: Verify evaluated component fingerprint
        run: python evaluation/check_component_baseline.py
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: evaluation/results/ci

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install pip-audit==2.9.0
      - name: Audit backend dependencies
        run: pip-audit --requirement backend/requirements.txt
      - name: Audit frontend dependencies
        run: pip-audit --requirement frontend/requirements.txt

  container-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag afrishield-backend:test .
      - name: Build frontend image
        run: docker build --file frontend/Dockerfile --tag afrishield-frontend:test .
